server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Supabase 反向代理：前端所有 Supabase 请求走这里，绕过客户端直连超时
    location /sb/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://lkmdydlrnpukpxkyagit.supabase.co/;
        proxy_set_header Host lkmdydlrnpukpxkyagit.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    location /api/research/ {
        rewrite ^/api/research/(.*) /research/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
